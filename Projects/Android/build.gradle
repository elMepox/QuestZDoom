buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

def appBaseName = "questzdoom"

base {
    archivesName = appBaseName
}

// Directory the OpenXR loader is unpacked into (see extractOpenXrLoader below).
def openxrJniLibsDir = layout.buildDirectory.dir("generated/openxr-loader/jniLibs").get().asFile

android {
    namespace = "com.drbeef.questzdoom"
    compileSdk = 36
    // r28c: the AGP 9 default NDK. r28+ links 16 KB page-aligned by default.
    ndkVersion = "28.2.13676358"

    packaging {
        jniLibs {
            keepDebugSymbols += "**/*.so"
            // Uncompressed, page-aligned native libraries (required for 16 KB page size devices).
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId = "com.drbeef." + appBaseName
        minSdk = 29
        // Meta requires target API 34 for new Horizon apps.
        targetSdk = 34

        ndk {
            abiFilters.add('arm64-v8a')
        }

        externalNativeBuild {
            ndkBuild {
                def numProcs = Runtime.runtime.availableProcessors()
                arguments.add("V=0")
                arguments.add("-j$numProcs")
                abiFilters.add('arm64-v8a')
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = file('jni/Android.mk')
        }
    }

    signingConfigs {
        def keystorePath = (project.hasProperty('key.store')) ?
                new File(project.getProperty('key.store')) :
                project.file('android.debug.keystore')

        def keystorePassword = (project.hasProperty('key.store.password')) ?
                project.getProperty('key.store.password') : 'android'

        def keystoreKeyAlias = (project.hasProperty('key.alias')) ?
                project.getProperty('key.alias') : 'androiddebugkey'

        def keystoreKeyPassword = (project.hasProperty('key.alias.password')) ?
                project.getProperty('key.alias.password') : 'android'

        debug {
            storeFile = keystorePath
            storePassword = keystorePassword
            keyAlias = keystoreKeyAlias
            keyPassword = keystoreKeyPassword
            enableV2Signing = true
        }

        release {
            storeFile = keystorePath
            storePassword = keystorePassword
            keyAlias = keystoreKeyAlias
            keyPassword = keystoreKeyPassword
            enableV2Signing = true
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            debuggable = true
            externalNativeBuild {
                ndkBuild {
                    arguments.add("NDK_DEBUG=1")
                    arguments.add("USE_ASAN=1")
                }
            }
        }

        release {
            signingConfig = signingConfigs.release
            debuggable = false
            minifyEnabled = false
            externalNativeBuild {
                ndkBuild {
                    arguments.add("NDK_DEBUG=0")
                    arguments.add("USE_ASAN=0")
                }
            }
        }
    }

    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['../../java']
        jniLibs.srcDirs = ['libs', openxrJniLibsDir]
        res.srcDirs = ['../../res']
        assets.srcDirs = ['../../assets', 'jni/gzdoom-g3.3mgw_mobile/fm_banks', 'jni/gzdoom-g3.3mgw_mobile/soundfont']
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

configurations {
    openxrLoaderAar
}

dependencies {
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.60"
    openxrLoaderAar "org.khronos.openxr:openxr_loader_for_android:1.1.60@aar"
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

tasks.register("extractOpenXrLoader", Copy) {
    from({ zipTree(configurations.openxrLoaderAar.singleFile) }) {
        include "prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so"
        eachFile { fileCopyDetails ->
            fileCopyDetails.path = "arm64-v8a/libopenxr_loader.so"
        }
        includeEmptyDirs = false
    }
    into openxrJniLibsDir
}

tasks.named("preBuild").configure {
    dependsOn("extractOpenXrLoader")
}

// Android Studio may request this task while importing Groovy-only projects.
if (!tasks.findByName("prepareKotlinBuildScriptModel")) {
    tasks.register("prepareKotlinBuildScriptModel") {}
}
