name: Build APK

on:
  push:
    branches: [ master, modernize-build ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout (with the gzdoom engine submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform, build tools and NDK (runner image ships the SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Point Gradle at the runner SDK (repo ships a Windows local.properties)
        run: echo "sdk.dir=$ANDROID_HOME" > Projects/Android/local.properties

      - name: Build release APK
        working-directory: Projects/Android
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failure reason as an annotation (readable without log access).
            SUMMARY=$(awk '/\* What went wrong/{f=1} f' /tmp/gradle.log | head -n 45)
            if [ -z "$SUMMARY" ]; then SUMMARY=$(tail -n 60 /tmp/gradle.log); fi
            ENC=$(printf '%s' "$SUMMARY" | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Gradle build failed::$ENC"
          fi
          exit "$status"

      - name: Verify 16 KB page alignment
        working-directory: Projects/Android
        run: |
          APK=$(find build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" | tail -n 5
          mkdir -p /tmp/apkx && unzip -o -q "$APK" 'lib/*' -d /tmp/apkx
          for so in $(find /tmp/apkx -name '*.so'); do
            echo "$so"
            "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" -p "$so" | grep LOAD | awk '{print "  align", $NF}' | sort -u
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: questzdoom-release-apk
          path: Projects/Android/build/outputs/apk/release/*.apk
